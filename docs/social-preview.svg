<?xml version="1.0" encoding="UTF-8"?>
<!--
  GitHub social-preview card (1280×640). Export to PNG and upload at
  repo Settings → General → Social preview. Quick export:
    rsvg-convert -w 1280 -h 640 docs/social-preview.svg > docs/social-preview.png
  (or open in any browser / design tool and save as PNG).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#161a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#accent)"/>

  <g font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="180" fill="#ffffff" font-size="84" font-weight="700">MyLLM Skills</text>
    <text x="82" y="240" fill="#9aa4c4" font-size="34" font-weight="500">Open Agent-Skill format for on-device AI</text>

    <!-- skill chips -->
    <g font-size="26" fill="#cdd4ee" font-weight="600">
      <g>
        <rect x="80"  y="300" rx="22" ry="22" width="250" height="52" fill="#1f2742" stroke="#2f3a63"/>
        <text x="104" y="334">meeting-notes</text>
      </g>
      <g>
        <rect x="350" y="300" rx="22" ry="22" width="240" height="52" fill="#1f2742" stroke="#2f3a63"/>
        <text x="374" y="334">code-review</text>
      </g>
      <g>
        <rect x="610" y="300" rx="22" ry="22" width="260" height="52" fill="#1f2742" stroke="#2f3a63"/>
        <text x="634" y="334">research-brief</text>
      </g>
      <g>
        <rect x="80"  y="372" rx="22" ry="22" width="200" height="52" fill="#1f2742" stroke="#2f3a63"/>
        <text x="104" y="406">sql-query</text>
      </g>
      <g>
        <rect x="300" y="372" rx="22" ry="22" width="220" height="52" fill="#1f2742" stroke="#2f3a63"/>
        <text x="324" y="406">flashcards</text>
      </g>
      <g>
        <rect x="540" y="372" rx="22" ry="22" width="180" height="52" fill="#1f2742" stroke="#2f3a63"/>
        <text x="564" y="406">+ more</text>
      </g>
    </g>

    <text x="80" y="500" fill="#7f8ab0" font-size="28">Install with one tap. Runs on your own local model. Your data stays yours.</text>

    <text x="80" y="572" fill="#5E5CE6" font-size="28" font-weight="700">github.com/TeamDzX/myllm-skills</text>
    <text x="80" y="600" fill="#566090" font-size="22">MyLLM — the private, on-device AI agent for iOS · App Store</text>
  </g>
</svg>
